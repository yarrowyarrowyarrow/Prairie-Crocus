<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#101815;color:#dfe;font:13px system-ui}
iframe{width:900px;height:600px;border:0;display:block}</style>
</head><body>
<iframe id="m" src="map.html"></iframe>
<script>
// The Yard palette on the real map (dev page + the harness behind
// tests/test_yard_map.py, V3.72). A saved line is drawn without telling Python
// it was drawn (until V3.72 every open added a copy); an object is dragged,
// turned from its right-click menu and by R, and a turned rectangle is drawn
// turned. Mouse events go to whatever is under each point, as in
// boundary_probe.html; results go into document.title for --dump-dom.
const LAT = 53.5461, LNG = -113.4938, D = 0.00004;
const out = {};
let w, calls = [];
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function calledWith(name) { return calls.filter(c => c[0] === name); }
function px(lat, lng) {
  const p = w.map.latLngToContainerPoint([lat, lng]);
  const r = w.map.getContainer().getBoundingClientRect();
  return { x: r.left + p.x, y: r.top + p.y };
}
function fire(type, p, extra) {
  const el = w.document.elementFromPoint(p.x, p.y);
  el.dispatchEvent(new w.MouseEvent(type, Object.assign({
    bubbles: true, cancelable: true, view: w, clientX: p.x, clientY: p.y,
    button: type === 'contextmenu' ? 2 : 0, buttons: type === 'mousedown' ? 1 : 0,
  }, extra || {})));
  return el;
}
// The long side's bearing of a drawn rectangle, degrees clockwise from north.
function longBearing(layer) {
  const ll = layer.getLatLngs()[0];
  const kx = 111320 * Math.cos(LAT * Math.PI / 180), ky = 111320;
  const side = (a, b) => [(b.lng - a.lng) * kx, (b.lat - a.lat) * ky];
  const s1 = side(ll[0], ll[1]), s2 = side(ll[1], ll[2]);
  const long = Math.hypot(...s1) > Math.hypot(...s2) ? s1 : s2;
  let b = Math.atan2(long[0], long[1]) * 180 / Math.PI;
  b = ((b % 180) + 180) % 180;
  return Math.round(b);
}
function objectLayer(structId) {
  for (const k of Object.keys(w.structureMarkers)) {
    const g = w.structureMarkers[k];
    if (g._pdStruct && g._pdStruct.structId === structId)
      return g.getLayers().find(l => l.getLatLngs || l.getRadius);
  }
  return null;
}

async function run() {
  const ready = () => (w = document.getElementById('m').contentWindow).map && w.map.getContainer;
  for (let i = 0; i < 100 && !ready(); i++) await wait(50);
  if (!ready()) throw new Error('the map never started');
  w.bridge = new Proxy({}, { get: (t, name) => (...args) => { calls.push([name].concat(args)); } });
  w.map.setView([LAT, LNG], 21);
  await wait(100);

  // A saved fence, drawn again on open: nothing sent, its own id kept.
  calls = [];
  w.loadHedgerow({ points: [[LAT - D, LNG - D * 2], [LAT - D, LNG + D * 2]],
                   hedge_id: 'hedge_saved', style: 'fence', fence_kind: 'board',
                   color: '#795548', width_m: 0.3, spacing_m: 1, species: '' });
  await wait(30);
  out.load_line = { complete_sent: calledWith('onHedgerowComplete').length,
                    kept_id: !!w.hedgerowLayers.hedge_saved };
  // Drawing it again replaces it rather than stacking a second.
  w.loadHedgerow({ points: [[LAT - D, LNG - D * 2], [LAT - D, LNG + D * 2]],
                   hedge_id: 'hedge_saved', style: 'fence', color: '#795548' });
  out.load_line.layers = Object.keys(w.hedgerowLayers).length;

  // A line drawn by hand is still told to Python, once.
  calls = [];
  w.setMode('hedgerow', { style: 'wall', kind: 'wall', color: '#9e9e9e' });
  w.handleHedgerowClick(LAT - D * 1.5, LNG - D);
  w.handleHedgerowClick(LAT - D * 1.5, LNG + D);
  w.finishHedgerow();
  const drawn = calledWith('onHedgerowComplete');
  out.draw_line = { sent: drawn.length, style: drawn.length ? drawn[0][4] : '' };

  // A bee hotel (a 0.6 x 0.3 m rectangle), placed: north-south.
  w.setMode('none');
  w.placeStructureOnMap({ id: 'bee_hotel', name: 'Bee hotel', size_m: 0.6,
                          width_m: 0.3, shape: 'rectangle', category: 'Habitat' },
                        LAT, LNG);
  await wait(30);
  const hotel = objectLayer('bee_hotel');
  out.placed = { bearing: longBearing(hotel) };

  // Dragged two metres east: the move is reported with where it was.
  calls = [];
  const a = px(LAT, LNG), b = px(LAT, LNG + 2 / (111320 * Math.cos(LAT * Math.PI / 180)));
  fire('mousedown', a);
  for (let i = 1; i <= 5; i++) fire('mousemove', { x: a.x + (b.x - a.x) * i / 5, y: a.y });
  fire('mouseup', b);
  const moved = calledWith('onExistingFeatureMoved');
  out.drag = { sent: moved.length,
               from_lat: moved.length ? +moved[0][3].toFixed(6) : null,
               east_m: moved.length ? +((moved[0][6] - moved[0][4]) * 111320 *
                                        Math.cos(LAT * Math.PI / 180)).toFixed(1) : null };

  // Its right-click menu turns it 45°, and says so to Python.
  calls = [];
  const here = moved.length ? px(moved[0][5], moved[0][6]) : a;
  fire('contextmenu', here);
  const menu = w.document.getElementById('_pd_ctx_menu');
  const labels = menu ? Array.from(menu.querySelectorAll('div')).map(d => d.textContent) : [];
  out.menu = { turn: labels.some(t => t.indexOf('Turn 45') >= 0),
               remove: labels.some(t => t.indexOf('Remove') >= 0),
               removed_at_once: calledWith('onStructureRemoved').length };
  const turnItem = menu && Array.from(menu.querySelectorAll('div')).find(d => d.textContent.indexOf('Turn 45') >= 0);
  if (turnItem) turnItem.click();
  const turned = calledWith('onStructureTurned');
  out.turn_menu = { sent: turned.length, bearing: turned.length ? turned[0][5] : null,
                    drawn: longBearing(hotel) };
  if (w.hideContextMenu) w.hideContextMenu();

  // R with the pointer over it turns it again; with nothing under it, nothing.
  calls = [];
  fire('mouseover', here);
  out.turn_key = { turned: w.turnHoveredObject(),
                   bearing: calledWith('onStructureTurned').length ?
                     calledWith('onStructureTurned')[0][5] : null,
                   drawn: longBearing(hotel) };
  fire('mouseout', here);
  out.turn_key.away = w.turnHoveredObject();

  // A turned one loaded from a design is drawn turned.
  w.loadStructure({ id: 'compost_bin', name: 'Bin', size_m: 2, width_m: 1,
                    shape: 'rectangle', category: 'Storage', bearing_deg: 90 },
                  LAT + D * 2, LNG);
  out.loaded_turned = { bearing: longBearing(objectLayer('compost_bin')) };

  // An existing building mark still removes on a right-click, as before.
  calls = [];
  w.placeStructureOnMap({ id: 'existing_building', name: 'Garage', size_m: 4,
                          width_m: 3, shape: 'rectangle', category: 'Existing' },
                        LAT + D * 2, LNG + D * 3);
  await wait(20);
  fire('contextmenu', px(LAT + D * 2, LNG + D * 3));
  out.existing = { removed: calledWith('onStructureRemoved').length };

  // An existing hedge (V3.75): a solid band in its kind's green, no dots,
  // its kind's words, and a menu that only removes; a fence's too.
  if (w.hideContextMenu) w.hideContextMenu();
  const HL = LAT + D * 6;
  w.loadHedgerow({ points: [[HL, LNG - D * 3], [HL, LNG + D * 3]], hedge_id: 'hedge_cot',
                   style: 'hedge', kind: 'hedge', hedge_kind: 'cotoneaster',
                   color: '#2f6b3a', width_m: 1.0 });
  w.loadHedgerow({ points: [[HL + D * 2, LNG - D * 3], [HL + D * 2, LNG + D * 3]],
                   hedge_id: 'hedge_old', style: 'living_fence', color: '#66bb6a',
                   spacing_m: 1, species: '' });
  w.loadHedgerow({ points: [[HL + D * 4, LNG - D * 3], [HL + D * 4, LNG + D * 3]],
                   hedge_id: 'fence_plain', style: 'fence', kind: 'fence', color: '#795548' });
  const dotsOf = id => w.hedgerowLayers[id].getLayers()
    .filter(l => l instanceof w.L.CircleMarker).length;
  const lineOf = id => w.hedgerowLayers[id].getLayers()
    .find(l => l instanceof w.L.Polyline);
  const labelOf = id => {
    const m = w.hedgerowLayers[id].getLayers().find(l => l.options && l.options.icon);
    return m ? m.options.icon.options.html : '';
  };
  function menuOf(id) {
    if (w.hideContextMenu) w.hideContextMenu();
    const ll = lineOf(id).getLatLngs()[0];
    const p = px(ll.lat, ll.lng);
    lineOf(id).fire('contextmenu', { originalEvent: { clientX: p.x, clientY: p.y } });
    const m = w.document.getElementById('_pd_ctx_menu');
    return m ? Array.from(m.querySelectorAll('div')) : [];
  }
  const labelsOf = items => items.map(d => d.textContent.trim()).filter(t => t);
  calls = [];
  const hedgeItems = menuOf('hedge_cot');
  out.hedges = { dots: dotsOf('hedge_cot') + dotsOf('hedge_old'),
                 label: labelOf('hedge_cot'), old_label: labelOf('hedge_old'),
                 menu: labelsOf(hedgeItems),
                 removed_at_once: calledWith('onHedgerowRemoved').length };
  const removeItem = hedgeItems.find(d => d.textContent.indexOf('Remove') >= 0);
  if (removeItem) removeItem.click();
  out.hedges.removed = calledWith('onHedgerowRemoved').map(c => c[1]);
  out.hedges.gone = !w.hedgerowLayers.hedge_cot;
  out.hedges.fence_menu = labelsOf(menuOf('fence_plain'));
  if (w.hideContextMenu) w.hideContextMenu();

  // A line finishes the way an area closes (V3.75, the owner: a swale
  // "doesn't close"). A click on its last point finishes it; a quick second
  // click (a double-click's) is left to the double-click.
  const LL = LAT - D * 8;
  const lastCall = name => { const c = calledWith(name); return c.length ? c[c.length - 1] : null; };
  calls = [];
  w.setMode('hedgerow', { style: 'swale', kind: 'swale', color: '#4fc3f7', width_m: 1 });
  w.handleHedgerowClick(LL, LNG - D * 3);
  await wait(450);
  w.handleHedgerowClick(LL, LNG);
  await wait(450);
  w.handleHedgerowClick(LL + D, LNG + D * 3);
  await wait(450);
  w.handleHedgerowClick(LL + D, LNG + D * 3);           // its last point
  const swale = lastCall('onHedgerowComplete');
  out.lines = { swale_sent: calledWith('onHedgerowComplete').length,
                swale_points: swale ? JSON.parse(swale[2]).length : 0,
                swale_mode: w.currentMode };
  // A click on the first point closes it into a loop.
  calls = [];
  w.setMode('hedgerow', { style: 'fence', kind: 'fence', color: '#795548' });
  const F0 = [LL - D * 3, LNG - D * 3];
  w.handleHedgerowClick(F0[0], F0[1]); await wait(450);
  w.handleHedgerowClick(LL - D * 3, LNG + D * 3); await wait(450);
  w.handleHedgerowClick(LL - D * 6, LNG + D * 3); await wait(450);
  w.handleHedgerowClick(F0[0] + D * 0.05, F0[1]);       // a hair off the first
  const loop = lastCall('onHedgerowComplete');
  const lp = loop ? JSON.parse(loop[2]) : [];
  out.lines.loop_points = lp.length;
  out.lines.loop_closed = lp.length > 1 && lp[0][0] === lp[lp.length - 1][0]
                          && lp[0][1] === lp[lp.length - 1][1];
  // A double-click: its quick second click adds nothing and finishes nothing;
  // the double-click itself finishes the line.
  calls = [];
  w.setMode('hedgerow', { style: 'wall', kind: 'wall', color: '#9e9e9e' });
  w.handleHedgerowClick(LL - D * 9, LNG - D * 3); await wait(450);
  w.handleHedgerowClick(LL - D * 9, LNG + D * 3);
  w.handleHedgerowClick(LL - D * 9, LNG + D * 3);        // straight after
  out.lines.quick_sent = calledWith('onHedgerowComplete').length;
  out.lines.quick_points = w.hedgerowPoints.length;
  w.finishDrawing();                                    // the double-click
  const dbl = lastCall('onHedgerowComplete');
  out.lines.dbl_points = dbl ? JSON.parse(dbl[2]).length : 0;

  // An area closes on a click of its first corner, whatever it is.
  calls = [];
  const kindsClosed = [];
  for (const kind of ['bed', 'pond', 'path', 'rain_garden', 'building', 'lawn_to_convert']) {
    w.setMode('shape', { kind: kind, shape_type: 'Custom', fill_color: '#4caf50',
                         stroke_color: '#2e7d32', fill_opacity: 0.25, place: 'outline' });
    const A = LAT + D * 12, B = LNG + D * 6;
    w.handleShapeClick(A, B);
    w.handleShapeClick(A, B + D * 2);
    w.handleShapeClick(A + D * 2, B + D * 2);
    w.handleShapeClick(A + D * 0.05, B);                 // its first corner
    kindsClosed.push(calledWith('onShapeComplete').length);
  }
  out.closed = kindsClosed;

  // A rectangle of the size typed follows the cursor, R turns it 15°, and a
  // click puts it down whole (V3.75).
  calls = [];
  const RL = LAT - D * 14, RG = LNG - D * 4;
  w.setMode('shape', { kind: 'bed', shape_type: 'Garden Bed', fill_color: '#4caf50',
                       stroke_color: '#2e7d32', fill_opacity: 0.25,
                       place: 'rectangle', place_length_m: 4, place_width_m: 2 });
  w.updateAreaGhost(w.L.latLng(RL, RG));
  const ghost = w._areaGhost ? w._areaGhost.getLatLngs()[0].length : 0;
  const rectTurned = w.turnHoveredObject();
  w.handleShapeClick(RL, RG);
  const rect = lastCall('onShapeComplete');
  const rp = rect ? JSON.parse(rect[2]) : [];
  const kx = 111320 * Math.cos(RL * Math.PI / 180), ky = 111320;
  const side = (a, b) => [(b[1] - a[1]) * kx, (b[0] - a[0]) * ky];
  const sides = rp.length === 4 ? [side(rp[0], rp[1]), side(rp[1], rp[2])] : [];
  const long = sides.length ? sides.reduce((m, v) => Math.hypot(...v) > Math.hypot(...m) ? v : m) : [0, 0];
  let bearing = Math.atan2(long[0], long[1]) * 180 / Math.PI;
  bearing = ((bearing % 180) + 180) % 180;
  out.rectangle = { ghost: ghost, turned: rectTurned, corners: rp.length,
                    sides: sides.map(v => +Math.hypot(...v).toFixed(2)).sort(),
                    bearing: Math.round(bearing), area: rect ? +(+rect[9]).toFixed(1) : 0,
                    mode: w.currentMode, ghost_left: !!w._areaGhost };
  // A circle of the width typed.
  calls = [];
  const CL = LAT - D * 14, CG = LNG + D * 6;
  w.setMode('shape', { kind: 'pond', shape_type: 'Water Feature', fill_color: '#4fc3f7',
                       stroke_color: '#0288d1', fill_opacity: 0.4,
                       place: 'circle', place_across_m: 3 });
  out.circle_turns = w.turnPlacingArea();
  w.handleShapeClick(CL, CG);
  const circ = lastCall('onShapeComplete');
  const cp = circ ? JSON.parse(circ[2]) : [];
  const radii = cp.map(p => Math.hypot((p[1] - CG) * kx, (p[0] - CL) * ky));
  out.circle = { points: cp.length,
                 r_min: radii.length ? +Math.min(...radii).toFixed(2) : 0,
                 r_max: radii.length ? +Math.max(...radii).toFixed(2) : 0 };

  // Mulch rings (V3.76): Python's list drawn under the plants, the one in a
  // bed left out; a plant's right-click menu gives or takes away its ring.
  if (w.hideContextMenu) w.hideContextMenu();
  const ML = LAT + D * 20;
  w.setMulchRings([{ lat: ML, lng: LNG, r: 0.6, shown: true, plant_id: 5 },
                   { lat: ML, lng: LNG + D * 4, r: 0.6, shown: false, plant_id: 5 }]);
  const pane = w.map.getPane('mulchPane');
  const ringed = w.placePlantMarker(5, 'Ringed', ML, LNG, 1.0, 'shrub', null, null, null);
  const bare = w.placePlantMarker(5, 'Bare', ML + D * 3, LNG, 1.0, 'shrub', null, null, null);
  function plantMenu(id) {
    if (w.hideContextMenu) w.hideContextMenu();
    const c = w.plantMarkers[id];
    const p = px(c._pd.lat, c._pd.lng);
    c.fire('contextmenu', { originalEvent: { clientX: p.x, clientY: p.y } });
    const m = w.document.getElementById('_pd_ctx_menu');
    return m ? Array.from(m.querySelectorAll('div')) : [];
  }
  calls = [];
  const ringedItems = plantMenu(ringed);
  const takeAway = ringedItems.find(d => d.textContent.indexOf('mulch ring away') >= 0);
  if (takeAway) takeAway.click();
  out.mulch = { drawn: pane ? pane.querySelectorAll('path').length : -1,
                pane_z: pane ? +pane.style.zIndex : null,
                ringed_menu: labelsOf(ringedItems),
                bare_menu: labelsOf(plantMenu(bare)),
                sent: calledWith('onMulchRingToggled').map(c => [c[1], c[4], c[5]]) };
  if (w.hideContextMenu) w.hideContextMenu();

  document.title = 'MEASURED ' + JSON.stringify(out);
}
run().catch(e => { document.title = 'MEASURED ' + JSON.stringify({ error: String(e) + ' ' + (e.stack || '') }); });
</script></body></html>
