<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#101815;color:#dfe;font:13px system-ui}
iframe{width:640px;height:480px;border:0;display:block}
#out{padding:8px;white-space:pre-wrap;font-family:ui-monospace,monospace}</style>
</head><body>
<div id="out">working…</div>
<iframe id="v" src="scene3d.html"></iframe>
<script src="probe_watch.js"></script>
<script>
// A wildflower built from its own numbers, read back from the real viewer
// (V3.48): the gate behind tests/test_leafy_render.py.
//
//   ?job=URL   one JSON {scenes: {name: scene}, shapes: [...], forms: [...]}.
//
// For each scene it pushes it and reports, for every herb mesh, whether the
// body is one of html/scene3d/03c-leafy.js's, its triangles, its stem tips,
// its extent and the scale it was placed at, and where the flowers were put.
// Then it builds every form with every leaf outline, off the scene, and
// reports each one's triangles and whether any coordinate is not a number.
// The result goes into document.title as "MEASURED {...}", as the other
// probes' does; a headless `--dump-dom` run carries it out.

const out = document.getElementById('out');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(test, ms) {
  for (let t = 0; t < ms; t += 100) { if (test()) return true; await sleep(100); }
  return false;
}
function viewer() { return document.getElementById('v').contentWindow; }

function bodies(w) {
  const found = [];
  w.eval('plantsGroup').traverse((o) => {
    // A body, not what sits on it: florets, vines and pond parts name theirs.
    if (!o.isInstancedMesh || !o.userData.pickId || o.userData.part) return;
    const g = o.geometry, u = g.userData || {};
    g.computeBoundingBox();
    const m = new w.THREE.Matrix4(), p = new w.THREE.Vector3(),
      q = new w.THREE.Quaternion(), s = new w.THREE.Vector3();
    o.getMatrixAt(0, m); m.decompose(p, q, s);
    const pos = g.attributes.position;
    let bad = 0;
    for (let i = 0; i < pos.count * 3; i++) if (!Number.isFinite(pos.array[i])) bad++;
    found.push({
      id: o.userData.pickId[0], name: o.userData.pick[0],
      leafy: !!u.leafy, triangles: g.index ? g.index.count / 3 : pos.count / 3,
      plan: u.leafy ? u.leafy.plan : null, tips: (u.tips || []).length,
      top: g.boundingBox.max.y, bottom: g.boundingBox.min.y,
      unit_half_width: u.unitHalfWidth, body_half_width: u.bodyHalfWidth,
      scale: [s.x, s.y, s.z], colours: !!g.attributes.color, bad,
    });
  });
  return found;
}

function anchors(w, sc) {
  // What the flower layer is handed for the first plant: its stem tips, in the scene.
  const p = w.eval('lastSceneObj').plants[0];
  const a = w.bloomAnchors(p, 400, sc.month || 7) || [];
  return a.map((q) => [q.x, q.y, q.z, q.top ? 1 : 0]);
}

async function run(w, job) {
  const res = { scenes: {}, matrix: [] };
  for (const name in job.scenes || {}) {
    const sc = job.scenes[name];
    w.permaSetQuality(sc.quality == null ? 1 : sc.quality);
    w.permaSetScene(sc);
    await until(() => w.permaModelsReady(), 60000);
    await sleep(400);
    // A mat's leafy shoots, a mesh beside its body (V3.65).
    const cards = [];
    w.eval('plantsGroup').traverse((o) => {
      if (o.isInstancedMesh && o.userData.part === 'mat_cards')
        cards.push({ count: o.count, triangles: o.geometry.index.count / 3,
                     cut: !!(o.material && o.material.alphaMap || o.customDepthMaterial) });
    });
    res.scenes[name] = { bodies: bodies(w), anchors: anchors(w, sc), cards,
                         budget: w.eval('LEAFY_BUDGET') };
  }
  // Every form with every outline, built off the scene.
  w.permaSetQuality(1);
  for (const form of job.forms || []) {
    for (const shape of job.shapes || []) {
      for (const arrangement of ['alternate', 'opposite', 'whorled', 'basal']) {
        const p = { genus: 'Testus', species: shape, bloom_start: 0,
                    drawn: { body: 'leafy', form, habit: 'erect', mature_h: 0.5, mature_w: 0.4,
                             stems: 9, nodes: 0, leaf_m: 0.05, leaf_shape: shape,
                             arrangement, branching: 'branched_above', basal: true } };
        let row = { form, shape, arrangement };
        try {
          const g = w.buildLeafyGeo(p, 0);
          const pos = g.attributes.position;
          let bad = 0;
          for (let i = 0; i < pos.count * 3; i++) if (!Number.isFinite(pos.array[i])) bad++;
          g.computeBoundingBox();
          row = Object.assign(row, { triangles: g.index.count / 3, bad,
                                     tips: g.userData.tips.length,
                                     top: g.boundingBox.max.y, key: w.leafyKeyFor(p) });
          g.dispose();
        } catch (e) { row.error = String(e && e.message || e); }
        res.matrix.push(row);
      }
    }
  }
  // A mat of leafy shoots, with every outline (V3.65): its leaves are cards.
  res.mats = [];
  for (const shape of job.shapes || []) {
    for (const arrangement of ['alternate', 'opposite', 'whorled']) {
      const p = { genus: 'Testus', species: shape, bloom_start: 0,
                  drawn: { body: 'leafy', form: 'mat', habit: 'mat', mature_h: 0.12, mature_w: 0.6,
                           stems: 8, nodes: 0, leaf_m: 0.015, leaf_shape: shape, arrangement,
                           branching: 'branched_throughout', basal: false } };
      const row = { shape, arrangement };
      try {
        const g = w.buildLeafyGeo(p, 0), cg = g.userData.cards;
        let bad = 0;
        for (const geo of [g, cg]) {
          const a = geo ? geo.attributes.position.array : [];
          for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) bad++;
        }
        cg.computeBoundingBox();
        Object.assign(row, { cards: g.userData.leafy.cards, triangles: g.userData.leafy.triangles,
                             bad, card_top: cg.boundingBox.max.y, uv: !!cg.attributes.uv });
      } catch (e) { row.error = String(e && e.message || e); }
      res.mats.push(row);
    }
  }
  return res;
}

(async function () {
  const q = new URLSearchParams(location.search);
  try {
    if (!q.get('job')) {
      out.textContent = 'Run this through tests/test_leafy_render.py: it needs the job it serves.';
      return;
    }
    const ok = await until(() => {
      const w = viewer();
      return w && typeof w.permaSetScene === 'function' && typeof w.permaShowView === 'function';
    }, 60000);
    if (!ok) throw new Error('the viewer never finished loading its chunks');
    const res = await run(viewer(), await (await fetch(q.get('job'))).json());
    document.title = 'MEASURED ' + JSON.stringify(res);
    out.textContent = JSON.stringify(res, null, 1);
  } catch (e) {
    document.getElementById('probe-errors').textContent += 'probe: ' + (e && e.stack || e) + '\n';
    document.title = 'FAILED';
  }
})();
</script></body></html>
